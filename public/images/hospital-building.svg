<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E6F4F1"/>
      <stop offset="100%" stop-color="#F8FCFB"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="12" fill="url(#skyGrad)"/>
  <!-- Trees / Greenery -->
  <circle cx="50" cy="220" r="35" fill="#A7F3D0"/>
  <circle cx="350" cy="215" r="40" fill="#6EE7B7"/>
  <!-- Main Building -->
  <rect x="80" y="80" width="240" height="180" rx="6" fill="#FFFFFF" stroke="#0E5A52" stroke-width="3"/>
  <!-- Top header band -->
  <rect x="80" y="80" width="240" height="35" fill="#0E5A52"/>
  <text x="200" y="103" font-family="'Noto Sans Bengali', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">BELLVIEW NURSING HOME</text>
  <!-- Red/Teal Medical Cross -->
  <circle cx="200" cy="140" r="16" fill="#E0F2FE"/>
  <path d="M200 130 V150 M190 140 H210" stroke="#0D9488" stroke-width="4" stroke-linecap="round"/>
  <!-- Windows -->
  <rect x="110" y="130" width="30" height="30" rx="3" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="260" y="130" width="30" height="30" rx="3" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="110" y="180" width="30" height="30" rx="3" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="260" y="180" width="30" height="30" rx="3" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.5"/>
  <!-- Main Entrance Door -->
  <rect x="175" y="185" width="50" height="75" rx="4" fill="#0E5A52"/>
  <rect x="180" y="190" width="40" height="40" rx="2" fill="#BAE6FD" opacity="0.6"/>
  <!-- Ramp / Steps -->
  <rect x="160" y="255" width="80" height="8" rx="2" fill="#CBD5E1"/>
  <!-- Ground -->
  <rect y="260" width="400" height="40" fill="#E2E8F0"/>
  <line x1="0" y1="260" x2="400" y2="260" stroke="#0E5A52" stroke-width="2"/>
</svg>

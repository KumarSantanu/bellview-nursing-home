<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 240" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="routeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4FAF8"/>
      <stop offset="100%" stop-color="#E8F4F0"/>
    </linearGradient>
  </defs>
  
  <rect width="700" height="240" rx="16" fill="url(#routeBg)" stroke="#CCE3DD" stroke-width="2"/>
  
  <!-- Step 1: Tamluk Railway Station -->
  <g transform="translate(40, 30)">
    <rect width="170" height="180" rx="12" fill="#FFFFFF" stroke="#0E5A52" stroke-width="2"/>
    <circle cx="85" cy="55" r="28" fill="#E0F2FE"/>
    <!-- Train icon -->
    <text x="85" y="65" font-size="28" text-anchor="middle">🚆</text>
    <text x="85" y="112" font-family="'Noto Sans Bengali', sans-serif" font-size="15" font-weight="700" fill="#0E5A52" text-anchor="middle">১. তমলুক স্টেশন</text>
    <text x="85" y="132" font-family="'Noto Sans Bengali', sans-serif" font-size="12" fill="#475569" text-anchor="middle">ট্রেনে এলে নামুন</text>
    <rect x="25" y="148" width="120" height="22" rx="11" fill="#E8F4F1"/>
    <text x="85" y="163" font-family="'Noto Sans Bengali', sans-serif" font-size="11" font-weight="600" fill="#0E5A52" text-anchor="middle">১ বা ২ নং প্ল্যাটফর্ম</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(225, 110)">
    <circle cx="20" cy="10" r="18" fill="#14B8A6"/>
    <path d="M14 10 H26 M21 5 L26 10 L21 15" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="20" y="38" font-family="'Noto Sans Bengali', sans-serif" font-size="11" font-weight="600" fill="#0E5A52" text-anchor="middle">২ মিনিট</text>
  </g>

  <!-- Step 2: Toto / Auto -->
  <g transform="translate(280, 30)">
    <rect width="170" height="180" rx="12" fill="#FFFFFF" stroke="#0E5A52" stroke-width="2"/>
    <circle cx="85" cy="55" r="28" fill="#FEF3C7"/>
    <!-- Toto / Rickshaw icon -->
    <text x="85" y="65" font-size="28" text-anchor="middle">🛺</text>
    <text x="85" y="112" font-family="'Noto Sans Bengali', sans-serif" font-size="15" font-weight="700" fill="#0E5A52" text-anchor="middle">২. টোটো বা হাঁটা</text>
    <text x="85" y="132" font-family="'Noto Sans Bengali', sans-serif" font-size="12" fill="#475569" text-anchor="middle">মাত্র ২৪০ মিটার পথ</text>
    <rect x="25" y="148" width="120" height="22" rx="11" fill="#FEF3C7"/>
    <text x="85" y="163" font-family="'Noto Sans Bengali', sans-serif" font-size="11" font-weight="600" fill="#B45309" text-anchor="middle">ধারিণ্ডা মোড়</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(465, 110)">
    <circle cx="20" cy="10" r="18" fill="#14B8A6"/>
    <path d="M14 10 H26 M21 5 L26 10 L21 15" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="20" y="38" font-family="'Noto Sans Bengali', sans-serif" font-size="11" font-weight="600" fill="#0E5A52" text-anchor="middle">সরাসরি</text>
  </g>

  <!-- Step 3: Bellview Nursing Home -->
  <g transform="translate(520, 30)">
    <rect width="150" height="180" rx="12" fill="#0E5A52" stroke="#083E38" stroke-width="2"/>
    <circle cx="75" cy="55" r="28" fill="#FFFFFF"/>
    <!-- Hospital icon -->
    <text x="75" y="65" font-size="28" text-anchor="middle">🏥</text>
    <text x="75" y="112" font-family="'Noto Sans Bengali', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">৩. বেলভিউ</text>
    <text x="75" y="132" font-family="'Noto Sans Bengali', sans-serif" font-size="11" fill="#E2E8F0" text-anchor="middle">নার্সিং হোম</text>
    <rect x="20" y="148" width="110" height="22" rx="11" fill="#14B8A6"/>
    <text x="75" y="163" font-family="'Noto Sans Bengali', sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">অভ্যর্থনা কাউন্টার</text>
  </g>
</svg>
